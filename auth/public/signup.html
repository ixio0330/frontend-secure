<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>계정 생성</title>
    <link rel="stylesheet" href="./signup.css" />
  </head>
  <body>
    <form action="/signup" method="post" id="signup">
      <fieldset>
        <legend class="form-caption">계정 생성</legend>
        <div>
          <label for="username">메일 주소</label>
          <input
            type="email"
            id="username"
            name="username"
            class="signup-input"
            required
            autocomplete="email"
          />
        </div>
        <div>
          <label for="password">비밀번호</label>
          <input
            type="password"
            id="password"
            name="password"
            class="signup-input"
            required
            pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$"
            title="비밀번호는 8자리 이상의 알파벳과 숫자를 조합해 주세요."
            autocomplete="new-password"
          />
          <!-- autocomplete="current-password" -->
        </div>
        <div>
          <label for="tel">전화번호</label>
          <input type="text" id="tel" inputmode="tel" name="tel" />
          <input type="text" id="tel" inputmode="numeric" name="tel" />
          <input type="text" id="tel" inputmode="email" name="tel" />
        </div>
        <div>
          <input
            type="checkbox"
            name="display-password"
            id="display-password"
          />
          <label for="display-password">비밀번호 표시</label>
        </div>
        <p>
          <small
            >비밀번호는 8자 이상 알파벳과 숫자의 조합을 사용해주세요.</small
          >
          <button id="subimt" type="submit">계정 생성</button>
        </p>
      </fieldset>
    </form>

    <script>
      const btn = document.querySelector("#submit");
      const password = document.querySelector("#password");
      btn.addEventListener("click", () => {
        // JS로 유효성 검증
        if (!/^[A-Za-z\d]{8,}$/.test(password.value)) {
          password.setCustomValidity(
            "8자리 이상으로 알파벳과 숫자를 조합해 주세요!",
          );
        }
      });

      const checkbox = document.querySelector("#display-password");
      checkbox.addEventListener("change", () => {
        if (checkbox.checked) {
          password.type = "text";
          return;
        }

        password.type = "password";
      });
    </script>
  </body>
</html>
