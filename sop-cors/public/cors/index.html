<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CORS 실습</title>
  </head>
  <body>
    <script>
      async function test() {
        try {
          const resOrigin = await fetch("http://localhost:3000/api/cors", {
            headers: {
              "X-Token": "abcdefg",
            },
          });
          const res = await resOrigin.text();
          console.log(res);
        } catch (error) {
          console.log(error);
        }
      }

      test();
    </script>
  </body>
</html>
