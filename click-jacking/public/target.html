<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>클릭재킹 실습</title>
  </head>
  <body>
    <button id="btn">삭제</button>
    <script>
      const btn = document.getElementById("btn");
      btn.addEventListener("click", (e) => {
        alert("삭제 버튼이 클릭되었습니다.");
      });
    </script>
  </body>
</html>
